services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_URI_STANDARD: ${MONGODB_URI_STANDARD:-}
    ports:
      - "${API_PORT:-5000}:5000"